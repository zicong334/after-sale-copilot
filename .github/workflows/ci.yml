# W12-3 交付物:CI 四门禁(语法 / 测试 / 评测 smoke / 交付物静态自检)。
#
# 密封口径:本仓库全部离线可跑,FakeLLM + FakeJudge(MOCK)。
# 不注入 LLM_API_KEY / LLM_BASE_URL / MINIMAX_API_KEY —— build_llm 无 key 时自动回退 FakeLLM。
#
# 注:本地仓库未配置 remote,本 workflow 推送后才真正生效;本地仅做 YAML 解析校验。

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  PYTHONPATH: backend
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint:
    name: lint(compileall + 交付物静态自检)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: 安装依赖(锁文件)
        run: python -m pip install -r requirements.lock.txt
      - name: 全量语法编译
        run: python -m compileall -q backend/app backend/scripts deploy
      - name: 交付物静态自检
        run: python deploy/lint_artifacts.py

  pytest:
    name: pytest(密封 FakeLLM + 增量覆盖率门禁)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # R2:diff-cover 需要历史才能算增量;默认 fetch-depth=1 会让门禁看不到 diff。
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.lock.txt
            requirements-dev.txt
      - name: 安装依赖(生产锁 + dev 覆盖率工具)
        run: python -m pip install -r requirements.lock.txt -r requirements-dev.txt
      - name: 确认未注入真实模型凭据
        run: |
          test -z "${LLM_API_KEY:-}" || { echo "检测到 LLM_API_KEY,密封测试不允许"; exit 1; }
          test -z "${MINIMAX_API_KEY:-}" || { echo "检测到 MINIMAX_API_KEY,密封测试不允许"; exit 1; }
      - name: 全量测试(带覆盖率)
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          python -m pytest backend/tests -q -p no:cacheprovider \
            --basetemp="$RUNNER_TEMP/pytest" \
            --cov --cov-report=xml:coverage.xml --cov-report=term-missing:skip-covered
      - name: 增量覆盖率门禁(diff line ≥ 80%)
        # R2(2026-11-21 企业工程评审):本项目三次实证「用例数 ≠ 覆盖」
        # (762 全绿时有 critical 越权 / B1 断言测错端点 / C1 路径从未被断言),
        # 所以必须卡**增量覆盖率**而不是数用例条数。
        # 落地时已实测:故意加一个未覆盖函数 → 门禁 rc=1 并指出缺失行号。
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="HEAD~1"
          fi
          echo "对比基线: $BASE"
          python -m diff_cover.diff_cover_tool coverage.xml \
            --compare-branch="$BASE" --fail-under=80
      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  eval:
    name: eval(--smoke,mock 基线)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: 安装依赖(锁文件)
        run: python -m pip install -r requirements.lock.txt
      - name: 确认未注入真实模型凭据
        run: |
          test -z "${LLM_API_KEY:-}" || { echo "检测到 LLM_API_KEY,密封评测不允许"; exit 1; }
      - name: 跑 smoke 评测(报告写临时目录,不脏 data/eval/reports)
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          python backend/scripts/run_eval.py --smoke \
            --run-id "ci-${{ github.run_id }}" \
            --out-dir "$RUNNER_TEMP/eval-reports"
      - name: 上传评测报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-smoke-report
          path: ${{ runner.temp }}/eval-reports
          if-no-files-found: warn

  deploy:
    name: deploy(交付物规则)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: 安装依赖(锁文件)
        run: python -m pip install -r requirements.lock.txt
      - name: Dockerfile / compose / nginx / prometheus / ci 规则
        run: python deploy/lint_artifacts.py
      - name: 说明
        run: echo "本 job 只做静态结构校验;真实 docker build 需在具备 Docker 的 runner 上另行开启"

  # R3 + Redis 三项的**运行时验证**(2026-11-21 用户裁定的"总开关")。
  # 本机无 docker/redis-server/psql,这三项一直标「未运行时验证」;
  # GitHub Actions 原生 services 起真 PG + 真 Redis,把它们变成可执行验证。
  # 跑通后按 docs/待验清单_20261121.md §5 清标记并贴本 job 原始输出。
  pg-redis:
    name: pg-redis(真 PG 迁移双向 + 全量测试 + 真 Redis 断言)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: copilot
          POSTGRES_PASSWORD: copilot
          POSTGRES_DB: copilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_URL: postgresql+psycopg://copilot:copilot@127.0.0.1:5432/copilot
      REDIS_TEST_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.lock.txt
            requirements-dev.txt
      - name: 安装依赖(生产锁含 psycopg + dev)
        run: python -m pip install -r requirements.lock.txt -r requirements-dev.txt
      - name: 确认未注入真实模型凭据
        run: |
          test -z "${LLM_API_KEY:-}" || { echo "检测到 LLM_API_KEY"; exit 1; }
          test -z "${MINIMAX_API_KEY:-}" || { echo "检测到 MINIMAX_API_KEY"; exit 1; }
      - name: PG 迁移 upgrade head(验 11 条迁移的方言)
        env:
          DATABASE_URL: ${{ env.PG_URL }}
        run: python -m alembic -c backend/alembic.ini upgrade head
      - name: 验关键列真在(0011 只加列不建表)
        env:
          DATABASE_URL: ${{ env.PG_URL }}
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect
          eng = create_engine(os.environ["DATABASE_URL"])
          cols = [c["name"] for c in inspect(eng).get_columns("order")]
          assert "delivered_at" in cols, cols
          print("order.delivered_at OK")
          PY
      - name: PG 迁移 downgrade base → upgrade head(双向)
        env:
          DATABASE_URL: ${{ env.PG_URL }}
        run: |
          python -m alembic -c backend/alembic.ini downgrade base
          python -m alembic -c backend/alembic.ini upgrade head
      - name: 全量测试跑在 PG 上(SQLite 专属两文件自动跳过)
        env:
          TEST_DATABASE_URL: ${{ env.PG_URL }}
          TMPDIR: ${{ runner.temp }}
        run: |
          # per-test 超时:把"未知卡死"变成**具名用例 + 堆栈**(2026-11-21 诊断手段)。
          # 上一轮在 52% 处卡 17 分钟无输出,只靠 job 级 20min 超时看不出是谁卡的。
          python -m pytest backend/tests -q -p no:cacheprovider \
            --basetemp="$RUNNER_TEMP/pytest_pg" \
            --timeout=90 --timeout-method=thread
      - name: 真 Redis 断言单独再跑一次(便于在日志里定位)
        # 这三条正是评审里标「未运行时验证」的:集群总放行量≈阈值、
        # EXPIRE 让键有界、Lua 真原子性。**不用假客户端**。
        run: python -m pytest backend/tests/test_redis_runtime.py -v -p no:cacheprovider

  # 2026-11-21:**runner 本身就是 Docker 机器** —— 之前把"容器真起/可观测真通/优雅停机"
  # 标成"需在有 Docker 的机器上跑",其实 CI 就能做(service container 只是用了 runner 的
  # Docker 的一个子集)。本 job 真 build 本项目镜像、真 compose up、真起 Prometheus、
  # 真发 SIGTERM 看是否优雅退出,把这三项也验掉。
  container:
    name: container(真 build 镜像 + compose 冒烟 + Prometheus + 优雅停机)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: 真 build 本项目镜像(不是 service container)
        run: docker compose -f deploy/docker-compose.yml build backend
      - name: 最小栈真起(backend + nginx)
        run: |
          docker compose -f deploy/docker-compose.yml up -d backend nginx
          for i in $(seq 1 40); do
            if docker compose -f deploy/docker-compose.yml ps --format '{{.Service}} {{.Health}}' | grep -q '^backend healthy'; then
              echo "backend healthy"; break
            fi
            sleep 3
          done
          docker compose -f deploy/docker-compose.yml ps
      - name: 经 nginx 冒烟(静态页 / liveness / readiness / 登录 / 一轮对话)
        run: |
          set -e
          B=http://127.0.0.1:8080
          curl -fsS "$B/login.html" > /dev/null && echo "login.html OK"
          curl -fsS "$B/health" && echo " <- liveness"
          curl -fsS "$B/healthz/ready" && echo " <- readiness"
          TOKEN=$(curl -fsS -X POST "$B/auth/login" -H 'Content-Type: application/json' \
            -d '{"username":"buyer_demo","password":"demo1234"}' | python -c 'import sys,json;print(json.load(sys.stdin)["token"])')
          test -n "$TOKEN"
          curl -fsS -X POST "$B/api/c/chat" -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' -d '{"text":"退货运费谁承担"}' \
            | python -c 'import sys,json;d=json.load(sys.stdin);assert d["ok"];print("chat OK, citations:",len(d.get("citations") or []))'
      - name: 可观测真通(Prometheus 抓取 + R6 新指标 + 告警规则加载)
        run: |
          set -e
          docker compose -f deploy/docker-compose.yml --profile observability up -d prometheus
          sleep 25
          curl -fsS http://127.0.0.1:9090/api/v1/targets \
            | python -c 'import sys,json;d=json.load(sys.stdin)["data"]["activeTargets"];assert any(t["health"]=="up" for t in d),d;print("scrape target up:",[t["scrapeUrl"] for t in d])'
          curl -fsS 'http://127.0.0.1:9090/api/v1/query?query=copilot_job_dead_oldest_age_seconds' \
            | python -c 'import sys,json;r=json.load(sys.stdin)["data"]["result"];assert r,"新指标查不到";print("dead_oldest_age =",r[0]["value"])'
          curl -fsS http://127.0.0.1:9090/api/v1/rules \
            | python -c 'import sys,json;g=json.load(sys.stdin)["data"]["groups"];names=[r["name"] for x in g for r in x["rules"]];assert "CopilotDeadLetterAging" in names,names;print("alert rules loaded:",names)'
      - name: 优雅停机真生效(SIGTERM 后应在 grace 内自行退出,退出码非 137)
        run: |
          set -e
          CID=$(docker compose -f deploy/docker-compose.yml ps -q backend)
          START=$(date +%s)
          docker stop "$CID" > /dev/null
          END=$(date +%s)
          CODE=$(docker inspect --format '{{.State.ExitCode}}' "$CID")
          echo "停机耗时 $((END-START))s,退出码 $CODE"
          # 137 = 128+9 = SIGKILL,说明 grace 内没排空完被强杀;0/143 = 收到 SIGTERM 后自行退出
          if [ "$CODE" = "137" ]; then
            echo "::error::退出码 137 = 被 SIGKILL 强杀,优雅停机未生效"
            exit 1
          fi
          echo "优雅停机生效(未被 SIGKILL)"
      - name: 收尾
        if: always()
        run: |
          docker compose -f deploy/docker-compose.yml --profile observability logs --tail=40 backend || true
          docker compose -f deploy/docker-compose.yml --profile observability down -v || true
