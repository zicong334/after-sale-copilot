# W12-3 交付物:nginx 入口(静态前端 + 反代 backend; /metrics 内网限定)。
# 该文件被 docker-compose.yml 挂载为 /etc/nginx/conf.d/default.conf。
#
# 安全口径:
# - /metrics 只允许回环与私有网段访问,其余一律 403;即使后端配了
#   METRICS_ALLOW_REMOTE=1,也不建议放开这一层。
# - WebSocket 走 /ws/ 前缀,显式 Upgrade/Connection 头与长连接超时。

upstream copilot_backend {
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # 上传/请求体上限:售后工单带截图,但不做无限放大。
    client_max_body_size 12m;

    # 静态前端:frontend/ 目录直接挂载为 html 根。
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # 指标端点:仅本机/内网;这里返回 403 而不是 404,便于排障时区分"没有"与"被拦"。
    location = /metrics {
        allow 127.0.0.1;
        allow ::1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://copilot_backend;
    }

    location /health {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_pass http://copilot_backend;
    }

    # R7(2026-11-21 企业工程评审):readiness 探针,探 DB,不健康返 503。
    # ⚠️ 单机形态**刻意不用它做主动摘流**:upstream 只有一个 server,
    # 摘流 = 全站下线。它只用于告警与人工判断;多副本后才谈摘流,
    # 且届时要配最小可用实例数,否则 DB 抖动会从"部分失败"变成"全站不可用"。
    # /health 保持静态 liveness(不探下游),避免 DB 抖动触发全量重启。
    location /healthz/ready {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_pass http://copilot_backend;
    }

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_pass http://copilot_backend;
    }

    location /ws/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://copilot_backend;
    }
}
