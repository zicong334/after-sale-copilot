<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>安心退 · 登录</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23C05621'/%3E%3Cpath d='M16 6l8 3v7c0 5-3.4 8.6-8 10-4.6-1.4-8-5-8-10V9z' fill='none' stroke='%23fff' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M12.2 15.6l2.6 2.6 5-5' fill='none' stroke='%23fff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
</head>
<body>
  <!-- W8 登录页:账号密码 → 登录后按角色进入买家聊天或客服工作台。
       本页是唯一允许在无 token 状态下访问的业务页,浅色卡片直接复用 style.css 既有视觉令牌。 -->
  <main class="login-wrap">
    <section class="login-card" aria-labelledby="loginTitle">
      <div class="login-brand">
        <span class="brand-mark brand-mark-lg" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
               stroke-linejoin="round">
            <path d="M12 2.8 20 6v7.2c0 5.1-3.4 8.7-8 9.9-4.6-1.2-8-4.8-8-9.9V6l8-3.2Z" />
            <path d="M8.8 12.2l2.3 2.3 4.4-4.4" />
            <path d="M18.6 3.4l.6 1.5 1.5.6-1.5.6-.6 1.5-.6-1.5-1.5-.6 1.5-.6.6-1.5Z" fill="currentColor" stroke="none" />
          </svg>
        </span>
        <div>
          <h1 class="login-title" id="loginTitle">安心退</h1>
          <p class="login-sub">登录后，专属售后管家将为您服务</p>
        </div>
      </div>

      <!-- 已有登录态时的提示(可直接进入,也可退出换账号) -->
      <div class="login-hint hidden" id="loginHint" role="status"></div>

      <form id="loginForm" novalidate>
        <div class="login-field">
          <label for="username">账号</label>
          <input class="login-input" id="username" name="username" type="text"
                 autocomplete="username" maxlength="64" placeholder="请输入账号"
                 autocapitalize="off" spellcheck="false" required />
        </div>
        <div class="login-field">
          <label for="password">密码</label>
          <input class="login-input" id="password" name="password" type="password"
                 autocomplete="current-password" maxlength="256"
                 placeholder="请输入密码" required />
        </div>
        <p class="login-error" id="loginError" role="alert" aria-live="polite"></p>
        <button class="btn btn-primary login-submit" id="loginBtn" type="submit">登录</button>
      </form>

      <details class="login-demo" open>
        <summary class="login-demo-title">快速体验通道</summary>
        <p class="login-demo-note">无需注册，点选以下身份即可体验（统一密码 demo1234，点选后自动填入）。</p>
        <div class="login-demo-list" id="demoList">
          <button type="button" class="btn btn-ghost btn-sm login-demo-btn"
                  data-username="buyer_demo">体验买家 · 张三</button>
          <button type="button" class="btn btn-ghost btn-sm login-demo-btn"
                  data-username="buyer_demo2">体验买家 · 李四</button>
          <button type="button" class="btn btn-ghost btn-sm login-demo-btn"
                  data-username="agent_demo">值班坐席 · 1001</button>
          <button type="button" class="btn btn-ghost btn-sm login-demo-btn"
                  data-username="agent_demo2">值班坐席 · 1007</button>
        </div>
      </details>
    </section>
  </main>

  <!-- W15 U5:统一请求封装(全站唯一持有底层网络调用的文件),必须先于登录脚本加载 -->
  <script src="/api.js"></script>
  <script>
  /* W8 登录脚本(原生 JS,零依赖、零构建)
   * - 成功:按 user.role 写 sc_agent_token/user 或 sc_buyer_token/user,再跳转
   * - 失败:错误体 {"ok":false,"error":{code,message}} 取 message 展示
   * - W13 ISS-19/45:买家与客服凭证分槽;跨角色登录/退出只动本角色槽位 */
  (function () {
    "use strict";

    /* W13 ISS-19/45:按角色分槽保存,登录/退出只动本角色,不清对方凭证。 */
    var TOKEN_KEYS = { agent: "sc_agent_token", buyer: "sc_buyer_token" };
    var USER_KEYS = { agent: "sc_agent_user", buyer: "sc_buyer_user" };
    var DEMO_PASSWORD = "demo1234";

    var els = {
      form: document.getElementById("loginForm"),
      username: document.getElementById("username"),
      password: document.getElementById("password"),
      error: document.getElementById("loginError"),
      button: document.getElementById("loginBtn"),
      hint: document.getElementById("loginHint"),
      demoList: document.getElementById("demoList")
    };

    function setError(message) {
      els.error.textContent = message || "";
    }

    /* W15 U5:登录页也走统一请求封装(/api.js)——超时兜底 + 统一错误信封 + 写接口防重放头。
     * /api.js 没加载时降级为一次性失败信封,页面照常给出错误提示。 */
    var apiFetch = (window.SCApi && window.SCApi.createApiFetch)
      ? window.SCApi.createApiFetch({ tokenKey: "" })
      : function () {
        return Promise.resolve({
          ok: false, status: 0, data: null,
          error: { code: "no_transport", message: "请求封装未加载(/api.js)" }
        });
      };

    function slotOf(user) {
      return user && user.role === "agent" ? "agent" : "buyer";
    }

    /* 两槽都读(客服优先),只返回一份有效登录态 */
    function readSession() {
      var roles = ["agent", "buyer"];
      for (var i = 0; i < roles.length; i += 1) {
        var role = roles[i];
        try {
          var token = window.localStorage.getItem(TOKEN_KEYS[role]) || "";
          var raw = window.localStorage.getItem(USER_KEYS[role]);
          var user = raw ? JSON.parse(raw) : null;
          if (token && user && user.username) return { token: token, user: user, role: role };
        } catch (err) { /* 损坏值忽略 */ }
      }
      return null;
    }

    function clearSession(user) {
      var role = slotOf(user);
      try {
        window.localStorage.removeItem(TOKEN_KEYS[role]);
        window.localStorage.removeItem(USER_KEYS[role]);
      } catch (err) { /* 隐私模式忽略 */ }
    }

    function homeOf(user) {
      var base = user && user.role === "agent" ? "/agent.html" : "/chat.html";
      /* W13 ISS-19:透传 merchant_id(页面身份仍以 token 为准,参数仅作可读提示)。 */
      var merchantId = user && user.merchant_id ? String(user.merchant_id) : "";
      return merchantId ? base + "?merchant_id=" + encodeURIComponent(merchantId) : base;
    }

    function roleLabel(user) {
      return user && user.role === "agent" ? "客服坐席" : "买家";
    }

    /* 已有登录态:提示可直接进入或退出换账号,不自动跳转(避免无法切换账号) */
    (function showExistingSession() {
      var session = readSession();
      if (!session) return;
      var user = session.user;
      els.hint.textContent = "";
      els.hint.appendChild(document.createTextNode(
        "当前已登录为 " + (user.display_name || user.username) + "（" + roleLabel(user) + "）· "
      ));
      var enter = document.createElement("a");
      enter.href = homeOf(user);
      enter.className = "login-hint-link";
      enter.textContent = "直接进入";
      els.hint.appendChild(enter);
      els.hint.appendChild(document.createTextNode(" · "));
      var logout = document.createElement("button");
      logout.type = "button";
      logout.className = "login-hint-link login-hint-btn";
      logout.textContent = "退出该账号";
      logout.addEventListener("click", function () {
        clearSession(user);
        els.hint.classList.add("hidden");
        setError("");
      });
      els.hint.appendChild(logout);
      els.hint.classList.remove("hidden");
    })();

    /* 体验账号一键填入(只填,不代替点击登录) */
    els.demoList.addEventListener("click", function (ev) {
      var btn = ev.target.closest ? ev.target.closest(".login-demo-btn") : null;
      if (!btn) return;
      els.username.value = btn.getAttribute("data-username") || "";
      els.password.value = DEMO_PASSWORD;
      setError("");
      els.button.focus();
    });

    els.form.addEventListener("submit", function (ev) {
      ev.preventDefault();
      var username = els.username.value.trim();
      var password = els.password.value;
      if (!username || !password) {
        setError("请输入账号与密码");
        (username ? els.password : els.username).focus();
        return;
      }
      setError("");
      els.button.disabled = true;
      els.button.textContent = "登录中…";

      apiFetch("/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json", Accept: "application/json" },
        body: JSON.stringify({ username: username, password: password })
      })
        .then(function (out) {
          var data = (out && out.data) || {};
          if (!out.ok || data.ok === false || !data.token) {
            setError(
              (out.error && out.error.message) ||
              (data.error && data.error.message) ||
              ("登录失败(HTTP " + (out ? out.status : 0) + ")")
            );
            return;
          }
          try {
            var role = slotOf(data.user);
            window.localStorage.setItem(TOKEN_KEYS[role], data.token);
            window.localStorage.setItem(USER_KEYS[role], JSON.stringify(data.user || {}));
          } catch (err) {
            setError("浏览器禁用了本地存储,无法保存登录态");
            return;
          }
          location.replace(homeOf(data.user));
        })
        .catch(function (err) {
          setError("网络错误:" + (err && err.message ? err.message : String(err)));
        })
        .then(function () {
          els.button.disabled = false;
          els.button.textContent = "登录";
        });
    });

    /* 体验账号统一密码:不写在输入框 placeholder 里,避免干扰真实登录 */
    els.password.title = "快速体验通道密码:" + DEMO_PASSWORD;
    if (!els.username.value) els.username.focus();
  })();
  </script>
</body>
</html>
