<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>安心退 · 在线售后管家</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23C05621'/%3E%3Cpath d='M16 6l8 3v7c0 5-3.4 8.6-8 10-4.6-1.4-8-5-8-10V9z' fill='none' stroke='%23fff' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M12.2 15.6l2.6 2.6 5-5' fill='none' stroke='%23fff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
</head>
<body>
  <div class="toast-wrap" id="toastWrap" aria-live="polite" aria-atomic="false"></div>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
               stroke-linejoin="round">
            <path d="M12 3c4.5 0 8 3.1 8 7.2 0 4.4-3.6 7.6-8 7.6-1.1 0-2.2-.2-3.2-.6L4 20l1.2-4.2A7 7 0 0 1 4 10.2C4 6.1 7.5 3 12 3Z" />
            <path d="M12 16.2c-2.6-1.4-4-3.2-4-5.1 0-1.5 1.2-2.6 2.6-2.6.9 0 1.6.5 1.9 1.2.3-.7 1-1.2 1.9-1.2 1.4 0 2.6 1.1 2.6 2.6 0 1.9-1.4 3.7-4 5.1Z" />
          </svg>
        </span>
        <span>安心退</span>
        <span class="brand-sub">智能售后管家</span>
      </div>
      <span class="status-badge" id="statusBadge" data-state="active">AI 接待中</span>
      <!-- W8:实时推送状态 + 退出登录;身份由登录 token 决定 -->
      <a class="btn btn-ghost btn-sm" href="/agent.html" target="_blank"
         rel="noopener" style="text-decoration:none">客服工作台</a>
      <span class="conn-badge" id="connBadge" data-state="connecting"
            title="服务连接状态">正在连接服务…</span>
      <button class="topbar-exit" id="logoutBtn" type="button">退出登录</button>
    </header>

    <div class="hidden" id="handoffBar" role="status"
         style="margin:10px 24px 0;padding:9px 14px;border-radius:10px;background:#FEF3C7;border:1px solid rgba(183,121,31,.28);color:#8A5A10;font-size:13px;line-height:1.5;">
      已为您转接人工坐席 · 专属坐席正在接入，您可以直接留言，坐席会尽快回复。
    </div>

    <!-- W14 ISS-41:我的订单快捷选择(登录买家本人订单,点选即发起售后) -->
    <section class="order-strip hidden" id="orderStrip" aria-label="我的订单快捷选择">
      <span class="order-strip-title">我的订单</span>
      <div class="order-chips" id="orderChips"></div>
    </section>

    <main class="stream" id="stream" aria-live="polite">
      <section class="empty" id="emptyState">
        <div class="empty-badge" aria-hidden="true">
          <svg class="empty-badge-star" width="46" height="46" viewBox="0 0 48 48" fill="none">
            <path d="M24 4l4.6 10.9L40 19.4l-8.6 8 2.4 11.6L24 33.4 14.2 39l2.4-11.6-8.6-8 11.4-4.5L24 4Z"
                  fill="currentColor" opacity=".16" />
            <path d="M24 7.5l3.7 8.8 9.2 3.6-6.9 6.5 1.9 9.3L24 31.2l-7.9 4.5 1.9-9.3-6.9-6.5 9.2-3.6L24 7.5Z"
                  fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
            <path d="M35.5 8.5l.9 2.2 2.2.9-2.2.9-.9 2.2-.9-2.2-2.2-.9 2.2-.9.9-2.2Z" fill="currentColor" />
          </svg>
        </div>
        <h1>您好，我是「安心退」智能管家。</h1>
        <p>把繁琐售后交给我，把放心结果还给你。</p>
        <div class="examples" id="examples">
          <button type="button" class="example-chip" data-text="我的退款什么时候能到账？帮我查一下退款进度"><svg class="chip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4.5v15" /><path d="M16.4 8.2c0-1.7-2-3-4.4-3S7.6 6.5 7.6 8.2s2 2.6 4.4 3 4.4 1.3 4.4 3-2 3-4.4 3-4.4-1.3-4.4-3" /></svg>查退款进度</button>
          <button type="button" class="example-chip" data-text="我的订单物流一直没更新，能帮我看看吗？"><svg class="chip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7.5h10v9H3z" /><path d="M13 10.5h3.6l3.4 3v3h-7z" /><path d="M6.6 18.4a1.6 1.6 0 1 0 0-3.2 1.6 1.6 0 0 0 0 3.2Z" /><path d="M17.4 18.4a1.6 1.6 0 1 0 0-3.2 1.6 1.6 0 0 0 0 3.2Z" /></svg>查物流进度</button>
          <button type="button" class="example-chip" data-text="收到的商品有瑕疵，我想退换，需要怎么操作？"><svg class="chip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8.6 12 4.4l8 4.2-8 4.2z" /><path d="M4 8.6v6.8l8 4.2 8-4.2V8.6" /><path d="M12 12.8v6.8" /></svg>商品瑕疵退换</button>
          <button type="button" class="example-chip" data-text="杭州今天天气怎么样？会不会影响快递配送？"><svg class="chip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.8 3.6v1.5" /><path d="M5.1 5.9l1.1 1" /><path d="M14.5 5.9l-1.1 1" /><path d="M7.9 9.4a2.5 2.5 0 1 1 3.9 2.1" /><path d="M10.4 17.4h6.3a2.8 2.8 0 0 0 .2-5.6 4.2 4.2 0 0 0-7.9 1.1 2.3 2.3 0 0 0 .4 4.5Z" /><path d="M11.2 19.5l-.7 1.5" /><path d="M14.1 19.5l-.7 1.5" /><path d="M17 19.5l-.7 1.5" /></svg>查天气</button>
        </div>
      </section>
    </main>

    <div class="closed-hint hidden" id="closedHint" role="status">工单已关闭，本次会话已结束。</div>

    <form class="composer" id="composer">
      <div class="composer-box">
        <textarea id="text" rows="1" autocomplete="off" maxlength="2000"
                  placeholder="描述您的售后问题…（Enter 发送，Shift+Enter 换行）"></textarea>
        <button class="btn btn-primary btn-send" id="send" type="submit" aria-label="发送消息">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M22 2 11 13" />
            <path d="M22 2 15 22l-4-9-9-4Z" />
          </svg>
        </button>
      </div>
    </form>

    <footer class="meta">
      <span>安心退 · 您的专属智能售后管家</span>
      <span class="assure-line">本服务由智能售后大模型提供支持 · 全天候服务保障</span>
    </footer>
  </div>

  <!-- W15 U5/U1:统一请求封装 + 共享 UI 组件(进度条/金额药丸) -->
  <script src="/api.js"></script>
  <script src="/ui.js"></script>
  <script src="/app.js"></script>
</body>
</html>
