# Alembic config (W1-A data layer)
# sqlalchemy.url points to backend/dev.db relative to ROOT; override via DATABASE_URL (see env.py)

[alembic]
script_location = backend/alembic
prepend_sys_path = .
sqlalchemy.url = sqlite:///backend/dev.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
